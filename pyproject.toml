[build-system]
requires = ["uv_build == 0.11.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aiogram_newsletter"
module-root = ""

[project]
name = "aiogram-newsletter"
version = "0.0.13"
description = "Newsletter handler for aiogram bots."
requires-python = ">=3.11"
dependencies = [
    "jobify >= 0.12.1",
    "aiogram[fast] >= 3.21.0",
]

[dependency-groups]
dev = [
    "ty == 0.0.37",
    "ruff == 0.15.13",
]
