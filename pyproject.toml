[build-system]
requires = ["uv_build == 0.11.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aiogram_newsletter"
module-root = ""

[project]
name = "aiogram-newsletter"
version = "0.0.13"
description = "Newsletter handler for aiogram bots."
requires-python = ">=3.11"
dependencies = [
    "jobify[fast] >= 0.12.1",
    "aiogram[fast] >= 3.25.0",
    "cachebox >= 5.2.3",
    "adaptix >= 3.0.0b12",
]

[dependency-groups]
dev = [
    "ty == 0.0.37",
    "ruff == 0.15.13",
]
